name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      # The SPA-fallback traversal tests exercise the catch-all route, which
      # api.py only mounts when frontend/dist exists. Without a build they skip,
      # which silently drops the regression tests for an arbitrary-file-read.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (so SPA traversal tests run instead of skipping)
        working-directory: frontend
        run: npm ci && npm run build
      # Bare `pytest` on purpose: an explicit path argument overrides testpaths,
      # so `pytest tests/` would silently keep skipping eval_recall/. Letting
      # pyproject's testpaths govern keeps the suite list in one place.
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
